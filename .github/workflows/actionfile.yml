name: OpenTofu Deployment

on:
  push:

  # Allows manual execution from any branch
  workflow_dispatch:

# Required for GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: OpenTofu Deploy
    runs-on: ubuntu-latest
    #env:
      #TF_IN_AUTOMATION: true
     # TF_INPUT: false

    steps:

      # ---------------------------------------------------------
      # 1. Checkout the branch that triggered the workflow
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display GitHub context
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Event      : ${{ github.event_name }}"
          echo "role-to-assume: ${{ secrets.AWS_ROLE_ARN }}"
          echo "aws-region: ${{ secrets.AWS_REGION }}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------------------------------
      # 8. Verify AWS identity
      # ---------------------------------------------------------
      - name: Verify AWS access
        run: |
          aws sts get-caller-identity
      # ---------------------------------------------------------
      # 2. Install OpenTofu
      # ---------------------------------------------------------
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1

      # ---------------------------------------------------------
      # 3. Get Terraform/OpenTofu variables from GitHub Secret
      #
      # TF_VARS is expected to contain something like:
      #
      # environment = "dev"
      # aws_region  = "ap-south-1"
      # ...
      # ---------------------------------------------------------
      - name: Create temporary terraform.tfvars
        shell: bash
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          set -euo pipefail

          if [ -z "$TF_VARS" ]; then
            echo "ERROR: TF_VARS repository secret is empty or not configured."
            exit 1
          fi

          printf '%s\n' "$TF_VARS" > /tmp/terraform.tfvars

          chmod 600 /tmp/terraform.tfvars

          echo "Temporary terraform.tfvars created."

      # ---------------------------------------------------------
      # 4. Read Terraform environment from TF_VARS
      #
      # Example:
      # environment = "dev"
      #
      # This is NOT a GitHub Environment.
      # ---------------------------------------------------------
      - name: Detect OpenTofu environment
        shell: bash
        run: |
          set -euo pipefail

          ENVIRONMENT=$(
            sed -nE \
              's/^[[:space:]]*environment[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              /tmp/terraform.tfvars \
              | head -n 1
          )

          if [ -z "$ENVIRONMENT" ]; then
            echo "ERROR: environment is not defined in TF_VARS."
            echo "Expected format:"
            echo 'environment = "dev"'
            exit 1
          fi

          # Prevent path traversal because ENVIRONMENT is used
          # to construct the Terraform working directory.
          if [[ ! "$ENVIRONMENT" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: Invalid environment value."
            exit 1
          fi

          echo "OpenTofu environment detected: $ENVIRONMENT"

          # Make ENVIRONMENT available to subsequent steps
          # echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          

      # ---------------------------------------------------------
      # 5. Create environment directory
      #
      # Example:
      # infrastructure/environments/dev/
      # infrastructure/environments/stage/
      # infrastructure/environments/prod/
      # ---------------------------------------------------------
      - name: Create Terraform environment directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            "infrastructure/environments/${ENVIRONMENT}"

      # ---------------------------------------------------------
      # 6. Copy temporary TF_VARS into selected environment
      # ---------------------------------------------------------
      - name: Create environment terraform.tfvars
        shell: bash
        run: |
          set -euo pipefail

          cp \
            /tmp/terraform.tfvars \
            "infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"

          chmod 600 \
            "infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"

      # ---------------------------------------------------------
      # 7. Configure AWS using GitHub OIDC
      #
      # AWS_ROLE_ARN:
      # Repository secret containing the IAM role ARN
      #
      # AWS_REGION:
      # Repository variable/secret containing AWS region
      # ---------------------------------------------------------

      # ---------------------------------------------------------
      # 9. Check OpenTofu formatting
      # ---------------------------------------------------------
      - name: OpenTofu format check
        working-directory: infrastructure
        run: |
          tofu fmt -check -recursive

      # ---------------------------------------------------------
      # 10. Initialize OpenTofu
      # ---------------------------------------------------------
      - name: OpenTofu Init
        working-directory: infrastructure/environments/${{ env.ENVIRONMENT }}
        run: |
          tofu init

      # ---------------------------------------------------------
      # 11. Validate OpenTofu configuration
      # ---------------------------------------------------------
      - name: OpenTofu Validate
        working-directory: infrastructure/environments/${{ env.ENVIRONMENT }}
        run: |
          tofu validate

      # ---------------------------------------------------------
      # 12. Create execution plan
      # ---------------------------------------------------------
      - name: OpenTofu Plan
        working-directory: infrastructure/environments/${{ env.ENVIRONMENT }}
        run: |
          tofu plan -out=tfplan

      # ---------------------------------------------------------
      # 13. Apply the exact plan generated above
      # ---------------------------------------------------------
      - name: OpenTofu Apply
        working-directory: infrastructure/environments/${{ env.ENVIRONMENT }}
        run: |
          tofu apply -auto-approve tfplan

      # ---------------------------------------------------------
      # 14. Always remove secrets and plan files
      # ---------------------------------------------------------
      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/terraform.tfvars

          if [ -n "${ENVIRONMENT:-}" ]; then
            rm -f \
              "infrastructure/environments/${ENVIRONMENT}/terraform.tfvars"

            rm -f \
              "infrastructure/environments/${ENVIRONMENT}/tfplan"
          fi
